<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復健衛教處方箋開立系統</title>
    <!-- 引入 html2pdf 庫用於生成 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #00796b;
            --bg-color: #f5f7f9;
            --border-color: #e0e0e0;
            --text-main: #333;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 頂部導覽列 */
        .header { background-color: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .header h1 { margin: 0; font-size: 1.5rem; color: var(--primary-color); }
        .btn-group button { padding: 8px 15px; margin-left: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-pdf { background-color: var(--primary-color); color: white; }
        .btn-email { background-color: #455a64; color: white; }

        /* 主要版面 */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 左側：個案與篩選區 */
        .sidebar-left { width: 300px; background: white; padding: 20px; overflow-y: auto; border-right: 1px solid var(--border-color); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #otherGoalInput { margin-top: 10px; display: none; }
        .section-title { border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; font-size: 1.1rem; }

        /* 中間：動作資料庫 */
        .database-area { flex: 1; padding: 20px; overflow-y: auto; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid var(--border-color); }
        .card-img { height: 160px; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin: 0 0 5px 0; }
        .card-tags { font-size: 0.8rem; color: #666; margin-bottom: 10px; }
        .card-desc { font-size: 0.9rem; flex: 1; margin-bottom: 15px; color: #555; }
        .btn-add { background-color: #e0f2f1; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-add:hover { background-color: var(--primary-color); color: white; }

        /* 右側：處方預覽與列印區 */
        .sidebar-right { width: 400px; background: #e0e0e0; padding: 20px; overflow-y: auto; display: flex; justify-content: center; }
        
        /* 實際 PDF 輸出的畫布 */
        .print-canvas { background: white; width: 100%; max-width: 800px; padding: 30px; box-shadow: 0 0 10px rgba(0,0,0,0.2); min-height: 100%; font-size: 14px; }
        .print-header { border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; margin-bottom: 20px; }
        .print-title { text-align: center; color: var(--primary-color); font-size: 1.5rem; margin-bottom: 15px; font-weight: bold; }
        .patient-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; }
        .patient-info-grid div { margin-bottom: 5px; }
        
        .prescription-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .prescription-item { border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; display: flex; gap: 15px; }
        .p-item-img { width: 100px; height: 100px; background: #eee; flex-shrink: 0; }
        .p-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .p-item-details { flex: 1; }
        .p-item-title { font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 8px; margin-top:0;}
        .p-item-row { font-size: 0.85rem; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .p-input { width: 40px; text-align: center; border: 1px solid #ccc; border-radius: 3px; padding: 2px; }
        .p-item-warn { font-size: 0.8rem; color: #d32f2f; background: #ffebee; padding: 4px; border-radius: 3px; margin-top: 5px; }
        .btn-remove { background: #ffcdd2; color: #c62828; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; float: right; font-size: 0.8rem; }

        .safety-warning { border: 2px solid #ff9800; background-color: #fff3e0; padding: 15px; border-radius: 8px; margin-top: 20px; font-weight: bold; color: #e65100; text-align: justify; }

        /* 隱藏不想列印的元素 */
        .hide-on-print { display: block; }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header class="header">
        <h1>🏥 復健復能處方箋開立系統</h1>
        <div class="btn-group">
            <button class="btn-email" onclick="sendEmail()">✉️ 寄送至信箱</button>
            <button class="btn-pdf" onclick="generatePDF()">📄 匯出 PDF</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 左側面板：個案資料 -->
        <aside class="sidebar-left">
            <div class="section-title">個案資料設定</div>
            <div class="form-group">
                <label>個案姓名</label>
                <input type="text" id="pName" placeholder="例如：王小明" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>床號</label>
                <input type="text" id="pBed" placeholder="例如：501A" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>病歷號</label>
                <input type="text" id="pRecord" placeholder="輸入病歷號" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>製作日期</label>
                <input type="date" id="pDate" onchange="updatePreview()">
            </div>
            <div class="form-group">
                <label>治療師姓名</label>
                <input type="text" id="pTherapist" placeholder="輸入姓名" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>主要目標</label>
                <select id="pGoal" onchange="toggleOtherGoal(); updatePreview()">
                    <option value="">請選擇目標</option>
                    <option value="促進耐力">促進耐力</option>
                    <option value="促進肌力">促進肌力</option>
                    <option value="促進日常生活功能">促進日常生活功能</option>
                    <option value="促進呼吸訓練">促進呼吸訓練</option>
                    <option value="促進認知訓練">促進認知訓練</option>
                    <option value="其他">其他 (自行輸入)</option>
                </select>
                <input type="text" id="otherGoalInput" placeholder="請輸入目標" oninput="updatePreview()">
            </div>
        </aside>

        <!-- 中間面板：動作資料庫 -->
        <main class="database-area">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="關鍵字搜索 (如：坐到站、肌力)..." oninput="filterDB()">
                <select id="categoryFilter" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;" onchange="filterDB()">
                    <option value="">所有分類</option>
                    <option value="平衡訓練">平衡訓練</option>
                    <option value="下肢肌力">下肢肌力</option>
                    <option value="上肢肌力">上肢肌力</option>
                    <option value="伸展">伸展活動</option>
                </select>
            </div>
            <div class="grid-container" id="dbGrid">
                <!-- JS 動態生成卡片 -->
            </div>
        </main>

        <!-- 右側面板：處方箋預覽區 (PDF 輸出目標) -->
        <aside class="sidebar-right">
            <div class="print-canvas" id="print-area">
                <div class="print-header">
                    <div class="print-title">居家復健復能處方箋</div>
                    <div class="patient-info-grid">
                        <div><strong>個案姓名：</strong> <span id="outName">未填寫</span></div>
                        <div><strong>製作日期：</strong> <span id="outDate">未填寫</span></div>
                        <div><strong>病歷號碼：</strong> <span id="outRecord">未填寫</span></div>
                        <div><strong>治療師：</strong> <span id="outTherapist">未填寫</span></div>
                        <div><strong>床位號碼：</strong> <span id="outBed">未填寫</span></div>
                        <div><strong>主要目標：</strong> <span id="outGoal">未填寫</span></div>
                    </div>
                </div>

                <!-- 處方動作清單 -->
                <div class="prescription-list" id="prescriptionList">
                    <p style="text-align: center; color: #999; margin-top: 50px;" class="hide-on-print">請從左側資料庫將動作加入處方箋</p>
                </div>

                <!-- 底部安全提醒 -->
                <div class="safety-warning">
                    ⚠️ 安全提醒：<br>
                    動作過程若出現胸悶、暈眩、明顯疼痛、呼吸困難或不穩跌倒風險，請立即停止並聯絡治療師或醫療人員。
                </div>
            </div>
        </aside>
    </div>

    <script>
        // 資料庫：擷取自文件 (圖片路徑已修正為 ./images/ )
        const exerciseDB = [
            {
                id: 1,
                name: "坐到站",
                category: "平衡訓練、下肢肌力訓練",
                image: "./images/sit-to-stand.jpg",
                desc: "由穩固椅子坐姿起身至站立，首先軀幹往前傾，臀部先離開座位再站起，再慢慢坐回，訓練大腿肌力與轉位能力。",
                easy: "雙手扶住扶手、獨自執行",
                hard: "雙手置於身體兩側或胸前",
                equipment: "椅子",
                precautions: "無法坐穩及無法單獨站立者，需要他人攙扶協助練習。"
            },
            {
                id: 2,
                name: "踮腳 (Heel Raise)",
                category: "站姿平衡訓練、下肢肌力訓練",
                image: "./images/heel-raise.jpg",
                desc: "雙手扶穩桌面，雙腳同時踮起腳跟後慢慢放下，訓練小腿肌力與站立控制。",
                easy: "雙手扶住桌子",
                hard: "雙手放在桌上、置於身體兩側",
                equipment: "椅子、桌子",
                precautions: "需可站立的人才可練習。如平衡不好需協助者在旁。"
            },
            {
                id: 3,
                name: "坐姿抬腳尖",
                category: "下肢肌力、踝關節活動",
                image: "./images/toe-raise.jpg",
                desc: "坐在椅子上，雙腳腳跟著地，將腳尖向上抬起。",
                easy: "坐姿單腳輪流抬起",
                hard: "站姿單/雙腳抬起",
                equipment: "椅子",
                precautions: "避免身體過度後傾。站姿需注意安全。"
            },
            {
                id: 4,
                name: "坐姿抬膝踏步",
                category: "坐姿平衡、下肢肌力訓練、心肺訓練",
                image: "./images/seated-marching.jpg",
                desc: "坐在椅子前半部，左右腳輪流抬膝。",
                easy: "雙手扶著椅子、墊腳尖取代腳抬起離地",
                hard: "手放在腿上，腳抬起時離開地面",
                equipment: "椅子",
                precautions: "如坐姿不穩定的人需他人在旁協助注意安全。"
            },
            {
                id: 5,
                name: "牆面手臂上舉",
                category: "關節活動、伸展活動、上肢肌力",
                image: "./images/wall-walk.jpg",
                desc: "面向牆壁，以手指沿牆面慢慢向上爬。",
                easy: "坐椅子、他人協助",
                hard: "站立獨立執行",
                equipment: "無",
                precautions: "停留在些微緊繃的角度即可。注意不可聳肩。"
            },
            {
                id: 6,
                name: "扶桌側走",
                category: "平衡活動、下肢肌力訓練",
                image: "./images/side-stepping.jpg",
                desc: "一手/兩手扶著桌邊行走。",
                easy: "兩手扶著桌子",
                hard: "一手扶著桌子",
                equipment: "桌子、椅子(備用)",
                precautions: "站姿不穩定或是體力比較差的人需協助者在旁陪同。"
            }
        ];

        let cart = [];

        // 初始化日期為今日
        document.getElementById('pDate').valueAsDate = new Date();

        // 渲染資料庫卡片
        function renderDB(data) {
            const grid = document.getElementById('dbGrid');
            grid.innerHTML = '';
            data.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${ex.image}" alt="${ex.name}" onerror="this.src='https://via.placeholder.com/250x160?text=無圖片'">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${ex.name}</h3>
                        <div class="card-tags">${ex.category}</div>
                        <div class="card-desc">${ex.desc}</div>
                        <button class="btn-add" onclick="addToCart(${ex.id})">➕ 加入處方箋</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 搜尋篩選功能
        function filterDB() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            
            const filtered = exerciseDB.filter(ex => {
                const matchKeyword = ex.name.includes(keyword) || ex.desc.includes(keyword) || ex.category.includes(keyword);
                const matchCategory = category === "" || ex.category.includes(category);
                return matchKeyword && matchCategory;
            });
            renderDB(filtered);
        }

        // 處理「主要目標」為其他的文字框顯示
        function toggleOtherGoal() {
            const select = document.getElementById('pGoal');
            const input = document.getElementById('otherGoalInput');
            input.style.display = select.value === '其他' ? 'block' : 'none';
        }

        // 即時更新處方箋預覽的個案資料
        function updatePreview() {
            document.getElementById('outName').innerText = document.getElementById('pName').value || '未填寫';
            document.getElementById('outBed').innerText = document.getElementById('pBed').value || '未填寫';
            document.getElementById('outRecord').innerText = document.getElementById('pRecord').value || '未填寫';
            document.getElementById('outDate').innerText = document.getElementById('pDate').value || '未填寫';
            document.getElementById('outTherapist').innerText = document.getElementById('pTherapist').value || '未填寫';
            
            let goal = document.getElementById('pGoal').value;
            if (goal === '其他') goal = document.getElementById('otherGoalInput').value;
            document.getElementById('outGoal').innerText = goal || '未填寫';
        }

        // 加入處方清單
        function addToCart(id) {
            const exercise = exerciseDB.find(e => e.id === id);
            if(cart.find(item => item.id === id)) {
                alert('此動作已經在處方箋中了！');
                return;
            }
            cart.push({...exercise, days: 1, times: 10, sets: 3, difficulty: 'easy', equipCheck: true});
            renderCart();
        }

        // 移除處方清單
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        // 渲染右側清單
        function renderCart() {
            const list = document.getElementById('prescriptionList');
            if(cart.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999; margin-top: 50px;" class="hide-on-print">請從左側資料庫將動作加入處方箋</p>';
                return;
            }
            list.innerHTML = '';
            cart.forEach((ex, index) => {
                const item = document.createElement('div');
                item.className = 'prescription-item';
                item.innerHTML = `
                    <div class="p-item-img">
                        <img src="${ex.image}" alt="${ex.name}" onerror="this.src='https://via.placeholder.com/100x100?text=無圖片'">
                    </div>
                    <div class="p-item-details">
                        <button class="btn-remove hide-on-print" onclick="removeFromCart(${ex.id})">刪除</button>
                        <h4 class="p-item-title">${ex.name}</h4>
                        <div class="p-item-row">
                            <strong>指示：</strong> ${ex.desc}
                        </div>
                        <div class="p-item-row hide-on-print">
                            <strong>難度：</strong> 
                            <label><input type="radio" name="diff_${ex.id}" value="easy" checked> 簡單 (${ex.easy})</label>
                            <label><input type="radio" name="diff_${ex.id}" value="hard"> 困難 (${ex.hard})</label>
                        </div>
                        <div class="p-item-row" style="display:none;" id="print_diff_${ex.id}">
                            <strong>難度調整：</strong> <span class="diff-text">${ex.easy}</span>
                        </div>
                        <div class="p-item-row hide-on-print">
                            <strong>使用設備：</strong>
                            <label><input type="checkbox" checked onchange="document.getElementById('print_equip_${ex.id}').style.display = this.checked ? 'inline' : 'none'"> ${ex.equipment}</label>
                        </div>
                        <div class="p-item-row" id="print_equip_${ex.id}">
                            <strong>使用設備：</strong> ${ex.equipment}
                        </div>
                        <div class="p-item-row" style="background:#f9f9f9; padding:8px; margin-top:8px; border-radius:4px;">
                            <strong>處方：</strong>
                            一天 <input type="number" class="p-input" value="${ex.days}" min="1"> 次；
                            每次 <input type="number" class="p-input" value="${ex.times}" min="1"> 下，
                            做 <input type="number" class="p-input" value="${ex.sets}" min="1"> 組。
                        </div>
                        <div class="p-item-warn">
                            <strong>注意事項：</strong> ${ex.precautions}
                        </div>
                    </div>
                `;
                
                // 綁定單選按鈕事件來切換列印時顯示的難度文字
                setTimeout(() => {
                    const radios = item.querySelectorAll(`input[name="diff_${ex.id}"]`);
                    const diffText = item.querySelector('.diff-text');
                    const printDiffRow = item.querySelector(`#print_diff_${ex.id}`);
                    
                    // 列印時需要把選項變成純文字顯示
                    printDiffRow.style.display = 'block'; 

                    radios.forEach(radio => {
                        radio.addEventListener('change', (e) => {
                            diffText.innerText = e.target.value === 'easy' ? ex.easy : ex.hard;
                        });
                    });
                }, 0);

                list.appendChild(item);
            });
        }

        // 生成 PDF (隱藏按鈕、確保版面正確後匯出)
        function generatePDF() {
            if(cart.length === 0) {
                alert('處方箋目前是空的，請先加入動作！');
                return;
            }
            
            // 隱藏不必要的元素
            const hideElements = document.querySelectorAll('.hide-on-print');
            hideElements.forEach(el => el.style.display = 'none');

            // 處理 input 框在 PDF 裡面的顯示問題（將 input 轉為純文字）
            const inputs = document.querySelectorAll('.prescription-list input[type="number"]');
            inputs.forEach(input => {
                const span = document.createElement('span');
                span.innerText = input.value;
                span.className = 'temp-print-span';
                span.style.fontWeight = 'bold';
                span.style.color = 'blue';
                span.style.padding = '0 5px';
                span.style.borderBottom = '1px solid #333';
                input.parentNode.insertBefore(span, input);
                input.style.display = 'none';
            });

            const element = document.getElementById('print-area');
            const opt = {
                margin:       10,
                filename:     `復健處方箋_${document.getElementById('pName').value || '未命名'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // 開始產生 PDF
            html2pdf().set(opt).from(element).save().then(() => {
                // 還原畫面
                hideElements.forEach(el => el.style.display = '');
                document.querySelectorAll('.temp-print-span').forEach(el => el.remove());
                inputs.forEach(input => input.style.display = 'inline-block');
            });
        }

        // 手機/電腦 寄信功能
        function sendEmail() {
            if(cart.length === 0) {
                alert('處方箋目前是空的！');
                return;
            }
            const pName = document.getElementById('pName').value || '個案';
            const subject = encodeURIComponent(`居家復健復能處方箋 - ${pName}`);
            const body = encodeURIComponent(`您好，\n\n這是為您開立的居家復健處方箋，請查閱系統匯出的 PDF 檔案進行練習。\n\n安全提醒：\n動作過程若出現胸悶、暈眩、明顯疼痛、呼吸困難或不穩跌倒風險，請立即停止並聯絡治療師或醫療人員。\n\n祝 平安健康！`);
            
            // 使用 mailto 協議開啟預設信箱 APP
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
            
            // 提示使用者
            setTimeout(() => {
                alert("由於技術限制，網頁無法直接自動夾帶附件 PDF。請您先點擊「匯出 PDF」將檔案下載到手機或電腦中，然後在彈出的郵件軟體中手動插入該 PDF 附件寄出。");
            }, 500);
        }

        // 初始載入
        renderDB(exerciseDB);
        updatePreview();

    </script>
